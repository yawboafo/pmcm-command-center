# Local services for the production backend (next phase). The prototype UI runs without them.
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: pmcm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: pmcm
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
